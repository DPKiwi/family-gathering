<body class="spark-widget-shell">
<script>
/**
 * Family Lunch Planner
 * A data-collection and real-time visualization tool for family coordination.
 */

const initApp = () => {
    let state, ui;

    // 1. Define top-level logic functions inside the loaded block
    const updateHUD = () => {
        const votes = state.votesData;
        const count = votes.length;
        
        // Find top venue
        const tallies = {};
        votes.forEach(v => {
            tallies[v.venue] = (tallies[v.venue] || 0) + 1;
        });
        
        let topVenue = "-";
        let maxVal = 0;
        for (const [name, val] of Object.entries(tallies)) {
            if (val > maxVal) {
                maxVal = val;
                topVenue = name;
            }
        }

        ui.setEditorial({
            hud: [
                { label: "Total Votes", value: count.toString() },
                { label: "Top Choice", value: topVenue }
            ]
        });
    };

    const submitVote = () => {
        // Construct the new record from current state
        const entry = {
            venue: state.venue,
            weekend: state.weekend,
            notes: state.notes
        };
        
        // Update internal state array (triggering reactivity)
        state.votesData = [...state.votesData, entry];
        
        // Reset the text field for the next user
        state.notes = "";
        
        // Refresh the dashboard stats
        updateHUD();
    };

    const copyVoteToClipboard = () => {
        const txt = `🗳️ Vote: ${state.venue} | Date: ${state.weekend}${state.notes ? ` | Notes: ${state.notes}` : ''}`;
        
        // Safe fallback clipboard write
        const el = document.createElement('textarea');
        el.value = txt;
        document.body.appendChild(el);
        el.select();
        document.execCommand('copy');
        document.body.removeChild(el);
        
        const status = document.getElementById('app-status') || document.querySelector('.header-status');
        if (status) {
            status.textContent = "Copied to clipboard! Now paste it into the Facebook comments. 📋";
            setTimeout(() => { status.textContent = ""; }, 4000);
        }
    };

    const importFacebookComments = () => {
        const text = state.importComments;
        if (!text.trim()) return;
        
        const lines = text.split('\n');
        const imported = [];
        
        lines.forEach(line => {
            let detectedVenue = "";
            let detectedWeekend = "";
            
            // Scan for venue keywords
            if (/miko|cafe/i.test(line)) detectedVenue = "Cafe Miko";
            else if (/good|home|takanini/i.test(line)) detectedVenue = "The Good Home";
            else if (/lone|star|manukau/i.test(line)) detectedVenue = "Lone Star";
            
            // Scan for dates
            if (/4-5|july 4/i.test(line)) detectedWeekend = "July 4-5";
            else if (/11-12|july 11/i.test(line)) detectedWeekend = "July 11-12";
            else if (/18-19|july 18/i.test(line)) detectedWeekend = "July 18-19";
            else if (/25-26|july 25/i.test(line)) detectedWeekend = "July 25-26";
            
            if (detectedVenue || detectedWeekend) {
                imported.push({
                    venue: detectedVenue || "Cafe Miko", // Fallback default
                    weekend: detectedWeekend || "July 4-5", // Fallback default
                    notes: "Imported from FB comment"
                });
            }
        });
        
        if (imported.length > 0) {
            state.votesData = [...state.votesData, ...imported];
            state.importComments = ""; // Clear box
            updateHUD();
            
            const status = document.getElementById('app-status') || document.querySelector('.header-status');
            if (status) {
                status.textContent = `Success! Imported ${imported.length} family votes. 📊`;
                setTimeout(() => { status.textContent = ""; }, 4000);
            }
        }
    };

    // 2. Initialize the App
    const app = WH.createApp({
        title: "Family Lunch Planner",
        params: {
            venue: { 
                type: "select", 
                value: "Cafe Miko", 
                options: ["Cafe Miko", "The Good Home", "Lone Star"], 
                label: "Preferred Venue" 
            },
            weekend: { 
                type: "select", 
                value: "July 4-5", 
                options: ["July 4-5", "July 11-12", "July 18-19", "July 25-26"], 
                label: "Preferred Weekend" 
            },
            notes: { 
                type: "text", 
                value: "", 
                label: "Notes & Requests",
                desc: "Add dietary notes or specific requests here."
            },
            submit: { 
                type: "button", 
                label: "Copy My Vote to Paste on Facebook", 
                onClick: copyVoteToClipboard 
            },
            headerOrganizer: {
                type: "header",
                label: "Organizer Dashboard"
            },
            importComments: {
                type: "text",
                value: "",
                label: "Paste FB Comments Here",
                desc: "Paste family comment lines here to auto-import votes!"
            },
            importButton: {
                type: "button",
                label: "Auto-Import Comments",
                onClick: importFacebookComments
            }
        },
        editorial: {
            hud: [
                { label: "Total Votes", value: "0" },
                { label: "Top Choice", value: "-" }
            ]
        }
    });

    state = app.state;
    ui = app.ui;

    // 3. Initialize Internal State with mock data for initial visual interest
    state.votesData = [
        { venue: "Cafe Miko", weekend: "July 4-5" },
        { venue: "Cafe Miko", weekend: "July 11-12" },
        { venue: "Lone Star", weekend: "July 4-5" },
        { venue: "The Good Home", weekend: "July 18-19" },
        { venue: "Cafe Miko", weekend: "July 25-26" },
        { venue: "The Good Home", weekend: "July 4-5" }
    ];

    // Initial HUD sync
    updateHUD();

    // 4. Initialize Visualization Engine
    WH.initPlot('viz', ({ width, state }) => {
        // Extract proxy data to plain array
        const votes = [...state.votesData];
        
        // Transform votes into a dual-category dataset for faceted plotting
        const chartData = [
            ...votes.map(v => ({ group: "Venue Popularity", item: v.venue })),
            ...votes.map(v => ({ group: "Date Availability", item: v.weekend }))
        ];

        return {
            width,
            style: {
                fontSize: "12px",
                fontFamily: "inherit",
                background: "transparent"
            },
            color: {
                domain: ["Venue Popularity", "Date Availability"],
                range: [WH.getColor('--chart-1'), WH.getColor('--chart-2')]
            },
            x: { 
                label: "Number of Votes →", 
                grid: true,
                ticks: Math.max(5, votes.length)
            },
            y: { 
                label: null,
                padding: 0.2
            },
            fy: {
                label: null
            },
            marks: [
                Plot.frame({ stroke: WH.getColor('--stroke-subtle'), strokeOpacity: 0.2 }),
                
                Plot.barX(chartData, Plot.groupY(
                    { x: "count" }, 
                    { 
                        y: "item", 
                        fy: "group", 
                        fill: "group", 
                        sort: { y: "x", reverse: true },
                        tip: true,
                        rx: 4 
                    }
                )),
                
                Plot.text(chartData, Plot.groupY(
                    { x: "count", text: "count" },
                    {
                        y: "item",
                        fy: "group",
                        dx: 12,
                        textAnchor: "start",
                        fontWeight: "bold",
                        fill: WH.getColor('--on-surface-default')
                    }
                ))
            ]
        };
    });
};

// Start initialization as soon as window and WH libraries are fully ready
if (typeof WH !== 'undefined') {
    initApp();
} else {
    window.addEventListener('DOMContentLoaded', () => {
        if (typeof WH !== 'undefined') {
            initApp();
        } else {
            // High-frequency polling backup to catch late-attaching window dependencies
            const checkInterval = setInterval(() => {
                if (typeof WH !== 'undefined') {
                    clearInterval(checkInterval);
                    initApp();
                }
            }, 15);
        }
    });
}
</script>
</body>
</html>
